[pytest]
DJANGO_SETTINGS_MODULE = machpaymanager.settings
python_files = tests.py test_*.py *_tests.py WS-*.py UT-*.py
addopts = --tb=short --create-db --ignore=test/UT-MAQ-021 --ignore=test/UT-MAQ-022 --ignore=test/UT-MS-001 --ignore=test/UT-SOL-005
testpaths = test
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    long: tests que requieren ejecución prolongada (deshabilitado por defecto)
    websocket: tests de WebSocket y telemetría en tiempo real
