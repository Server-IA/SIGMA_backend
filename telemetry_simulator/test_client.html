<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Simulator - Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .status {
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .status.disconnected {
            background: #fee;
            color: #c00;
        }
        
        .status.connected {
            background: #efe;
            color: #0a0;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .controls {
            margin-bottom: 20px;
        }
        
        .password-input {
            margin-bottom: 15px;
        }
        
        .password-input label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        
        .password-input input {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .password-input input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .data-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .data-card h3 {
            color: #667eea;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .data-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .data-card .unit {
            font-size: 12px;
            color: #666;
        }
        
        .log-container {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background: #f8f9fa;
        }
        
        .log-entry {
            padding: 5px;
            margin-bottom: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }
        
        .timestamp {
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Telemetry Simulator - Test Client</h1>
        
        <div id="status" class="status disconnected">
            ● Desconectado
        </div>
        
        <div class="password-input">
            <label for="passwordInput">🔑 Contraseña WebSocket:</label>
            <input 
                type="password" 
                id="passwordInput" 
                placeholder="Ingresa la contraseña para conectarte"
                value="telemetry_password_2024"
            />
        </div>
        
        <div class="controls">
            <button id="connectBtn" onclick="connect()">Conectar</button>
            <button id="disconnectBtn" onclick="disconnect()" disabled>Desconectar</button>
        </div>
        
        <div class="data-grid" id="dataGrid">
            <!-- Los datos se insertarán aquí dinámicamente -->
        </div>
        
        <h2 style="margin-top: 30px;">📋 Log de Datos</h2>
        <div class="log-container" id="logContainer"></div>
    </div>

    <script>
        let ws = null;
        let currentData = {};
        
        function updateStatus(connected) {
            const status = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            if (connected) {
                status.className = 'status connected';
                status.textContent = '● Conectado - Recibiendo datos...';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                status.className = 'status disconnected';
                status.textContent = '● Desconectado';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }
        
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="timestamp">${new Date().toLocaleTimeString()}</span>
                <span>${message}</span>
            `;
            logContainer.insertBefore(entry, logContainer.firstChild);
        }
        
        function updateDataGrid(data) {
            currentData = data.data;
            const grid = document.getElementById('dataGrid');
            
            grid.innerHTML = `
                <div class="data-card" style="grid-column: 1 / -1; background: #f0f4ff;">
                    <h3>📱 IMEI del Dispositivo</h3>
                    <div class="value" style="font-size: 18px;">${data.imei}</div>
                </div>
                
                <div class="data-card" style="grid-column: 1 / -1; background: #f0f4ff;">
                    <h3>⏰ Timestamp</h3>
                    <div class="value" style="font-size: 14px;">${data.timestamp}</div>
                </div>
                
                ${data.data.speed !== undefined ? `
                <div class="data-card">
                    <h3>🚀 Velocidad</h3>
                    <div class="value">${data.data.speed}</div>
                    <div class="unit">km/h</div>
                </div>
                ` : ''}
                
                ${data.data.ignition_status !== undefined ? `
                <div class="data-card">
                    <h3>🔋 Estado Ignición</h3>
                    <div class="value">${data.data.ignition_status ? 'ON' : 'OFF'}</div>
                </div>
                ` : ''}
                
                ${data.data.movement_status !== undefined ? `
                <div class="data-card">
                    <h3>🚦 Movimiento</h3>
                    <div class="value">${data.data.movement_status ? 'SI' : 'NO'}</div>
                </div>
                ` : ''}
                
                ${data.data.rpm !== undefined ? `
                <div class="data-card">
                    <h3>🔧 RPM</h3>
                    <div class="value">${data.data.rpm}</div>
                    <div class="unit">rpm</div>
                </div>
                ` : ''}
                
                ${data.data.engine_temp !== undefined ? `
                <div class="data-card">
                    <h3>🌡️ Temperatura Motor</h3>
                    <div class="value">${data.data.engine_temp}</div>
                    <div class="unit">°C</div>
                </div>
                ` : ''}
                
                ${data.data.engine_load !== undefined ? `
                <div class="data-card">
                    <h3>⚡ Carga Motor</h3>
                    <div class="value">${data.data.engine_load}</div>
                    <div class="unit">%</div>
                </div>
                ` : ''}
                
                ${data.data.fuel_level !== undefined ? `
                <div class="data-card">
                    <h3>⛽ Combustible</h3>
                    <div class="value">${data.data.fuel_level}</div>
                    <div class="unit">%</div>
                </div>
                ` : ''}
                
                ${data.data.oil_level !== undefined ? `
                <div class="data-card">
                    <h3>🛢️ Aceite</h3>
                    <div class="value">${data.data.oil_level}</div>
                    <div class="unit">%</div>
                </div>
                ` : ''}
                
                ${data.data.gsm_signal !== undefined ? `
                <div class="data-card">
                    <h3>📶 Señal GSM</h3>
                    <div class="value">${data.data.gsm_signal}</div>
                    <div class="unit">/ 5</div>
                </div>
                ` : ''}
                
                ${data.data.gps_location !== undefined ? `
                <div class="data-card">
                    <h3>📍 Ubicación GPS</h3>
                    <div class="value" style="font-size: 14px;">${data.data.gps_location}</div>
                </div>
                ` : ''}
                
                ${data.data.instant_consumption !== undefined ? `
                <div class="data-card">
                    <h3>⛽ Consumo Instantáneo</h3>
                    <div class="value">${data.data.instant_consumption}</div>
                    <div class="unit">L/h</div>
                </div>
                ` : ''}
                
                ${data.data.fuel_used_gps !== undefined ? `
                <div class="data-card">
                    <h3>📊 Combustible Usado</h3>
                    <div class="value">${data.data.fuel_used_gps}</div>
                    <div class="unit">L</div>
                </div>
                ` : ''}
                
                ${data.data.odometer_total !== undefined ? `
                <div class="data-card">
                    <h3>📏 Odómetro Total</h3>
                    <div class="value">${data.data.odometer_total}</div>
                    <div class="unit">m</div>
                </div>
                ` : ''}
                
                ${data.data.odometer_trip !== undefined ? `
                <div class="data-card">
                    <h3>🚙 Odómetro Viaje</h3>
                    <div class="value">${data.data.odometer_trip}</div>
                    <div class="unit">m</div>
                </div>
                ` : ''}
                
                ${data.data.obd_faults && data.data.obd_faults.length > 0 ? `
                <div class="data-card" style="border-left-color: #c00;">
                    <h3>⚠️ Fallas OBD</h3>
                    <div class="value" style="font-size: 14px;">${data.data.obd_faults.join(', ')}</div>
                </div>
                ` : ''}
                
                ${data.data.event_type !== null && data.data.event_type !== undefined ? `
                <div class="data-card" style="border-left-color: #ff9800;">
                    <h3>📢 Tipo de Evento</h3>
                    <div class="value">${data.data.event_type}</div>
                </div>
                ` : ''}
                
                ${data.data.event_g_value !== null && data.data.event_g_value !== undefined ? `
                <div class="data-card" style="border-left-color: #ff9800;">
                    <h3>⚡ Valor G del Evento</h3>
                    <div class="value">${data.data.event_g_value}</div>
                </div>
                ` : ''}
                
                ${data.alerts && data.alerts.length > 0 ? `
                <div class="data-card" style="grid-column: 1 / -1; border-left-color: #f44336; background: #ffebee;">
                    <h3>🚨 Alertas Detectadas (${data.alerts.length})</h3>
                    <div style="margin-top: 10px;">
                        ${data.alerts.map(alert => `
                            <div style="padding: 8px; margin: 5px 0; background: white; border-radius: 4px; border-left: 3px solid #f44336;">
                                <strong>${alert.parameter}:</strong> ${alert.reason}
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}
            `;
        }
        
        function connect() {
            const passwordInput = document.getElementById('passwordInput');
            const password = passwordInput.value.trim();
            
            if (!password) {
                addLog('⚠️ Por favor ingresa la contraseña');
                passwordInput.focus();
                return;
            }
            
            addLog('🔌 Conectando al WebSocket...');
            
            try {
                // Construir URL con contraseña como query parameter
                const wsUrl = `ws://localhost:8003/ws/telemetria?password=${encodeURIComponent(password)}`;
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    addLog('✅ Conectado exitosamente');
                    updateStatus(true);
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    const imei = data.imei || 'N/A';
                    const timestamp = data.timestamp || 'N/A';
                    const alertsCount = data.alerts ? data.alerts.length : 0;
                    const alertsMsg = alertsCount > 0 ? `, ${alertsCount} alerta(s)` : '';
                    addLog(`📊 Datos recibidos - IMEI: ${imei}, TS: ${timestamp}, Velocidad: ${data.data?.speed || 'N/A'} km/h${alertsMsg}`);
                    updateDataGrid(data);
                };
                
                ws.onerror = (error) => {
                    addLog(`❌ Error en WebSocket: ${error}`);
                };
                
                ws.onclose = (event) => {
                    if (event.code === 4001) {
                        addLog('❌ Conexión rechazada: Contraseña incorrecta');
                    } else {
                        addLog(`🔌 Conexión cerrada (Código: ${event.code})`);
                    }
                    updateStatus(false);
                };
                
            } catch (error) {
                addLog(`❌ Error al conectar: ${error.message}`);
            }
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                addLog('🔌 Desconectando...');
            }
        }
        
        // Auto-conectar al cargar la página
        // window.onload = () => setTimeout(connect, 1000);
    </script>
</body>
</html>
