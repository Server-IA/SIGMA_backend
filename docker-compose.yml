services:
  simulator:
    build: ./telemetry_simulator
    container_name: telemetry_simulator
    ports:
      - "8003:8000"
    environment:
      DEVICE_IMEI: ${DEVICE_IMEI:-357894561234567}
      ALLOW_GENERATE_IMEI: ${ALLOW_GENERATE_IMEI:-true}
      WEBSOCKET_PASSWORD: ${WEBSOCKET_PASSWORD}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    networks:
      - shared_net
    restart: always

  telemetry_processor:
    build: .
    container_name: telemetry_processor
    command: python manage.py process_telemetry
    env_file:
      - .env
    environment:
      SERVICE_NAME: machpayroll
      AUDIT_URL: ${AUDIT_URL}
      AUDIT_TOKEN: ${AUDIT_TOKEN}
      AUDIT_HTTP_TIMEOUT: "1.5"
      X_CSCAPI_KEY: ${X_CSCAPI_KEY}
      WEBSOCKET_PASSWORD: ${WEBSOCKET_PASSWORD}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
    depends_on:
      - simulator
    networks:
      - shared_net
    restart: always

  fmc150_decoder:
    build:
      context: .
      dockerfile: Dockerfile.decoder
    container_name: fmc150_decoder
    command: uvicorn fmc150_decoder.main:app --host 0.0.0.0 --port 8004 --no-access-log
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      FMC150_HOST: ${FMC150_HOST}
      FMC150_PORT: ${FMC150_PORT}
    ports:
      - "8004:8004"  # Puerto para el servidor web/websockets
      - "5055:5055"  # Puerto para el servidor TCP de los dispositivos
    networks:
      - shared_net
    restart: always

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_fmc150
    command: 
      - "tcp"
      - "--log=stdout"
      - "fmc150_decoder:5055"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"  # Web UI para monitorear conexiones
    depends_on:
      - fmc150_decoder
    networks:
      - shared_net
    restart: always

networks:
  shared_net:
    external: false
