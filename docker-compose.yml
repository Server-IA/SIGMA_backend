services:
  web:
    build: .
    container_name: machpay_backend
    command: >
    sh -c "python manage.py migrate && gunicorn machpaymanager.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - shared_net

  db:
    image: postgres:15
    container_name: machpay_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5436:5432"
    volumes:
      - machpay_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared_net

volumes:
  machpay_postgres_data:
