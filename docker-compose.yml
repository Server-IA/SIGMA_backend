services:
  web:
    build: .
    container_name: machpay_backend
    command: bash -lc "
      /app/wait_for_db.sh && \
      mkdir -p /app/logs && \
      printf '*/2 * * * * root cd /app && /usr/local/bin/python manage.py runcrons >> /app/logs/cron.log 2>&1\n' > /etc/cron.d/django_cron && \
      chmod 0644 /etc/cron.d/django_cron && \
      /usr/sbin/cron && \
      exec gunicorn machpaymanager.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SERVICE_NAME: machpayroll
      AUDIT_URL: ${AUDIT_URL}
      AUDIT_TOKEN: ${AUDIT_TOKEN}
      AUDIT_HTTP_TIMEOUT: "1.5"
    depends_on:
      - db
    networks:
      - shared_net

  db:
    image: postgres:15
    container_name: machpay_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5436:5432"
    volumes:
      - machpay_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared_net

volumes:
  machpay_postgres_data:

networks:
  shared_net:
    external: true
