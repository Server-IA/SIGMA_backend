services:
  db:
    image: postgres:15
    container_name: machpay_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - machpay_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - machpay_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  simulator:
    build: ./telemetry_simulator
    container_name: telemetry_simulator
    ports:
      - "8003:8000"
    environment:
      DEVICE_IMEI: ${DEVICE_IMEI:-357894561234567}
      ALLOW_GENERATE_IMEI: ${ALLOW_GENERATE_IMEI:-true}
      WEBSOCKET_PASSWORD: ${WEBSOCKET_PASSWORD}
      DATABASE_HOST: db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    networks:
      - machpay_network
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  telemetry_processor:
    build: .
    container_name: telemetry_processor
    command: python manage.py process_telemetry
    env_file:
      - .env
    environment:
      SERVICE_NAME: machpayroll
      AUDIT_URL: ${AUDIT_URL}
      AUDIT_TOKEN: ${AUDIT_TOKEN}
      AUDIT_HTTP_TIMEOUT: "1.5"
      X_CSCAPI_KEY: ${X_CSCAPI_KEY}
      WEBSOCKET_PASSWORD: ${WEBSOCKET_PASSWORD}
      DATABASE_HOST: db
      SIMULATOR_WS_URL: ws://simulator:8000/ws/telemetria
    networks:
      - machpay_network
    depends_on:
      simulator:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: always

networks:
  machpay_network:
    driver: bridge
    name: machpay_network

volumes:
  machpay_postgres_data:
