services:
  web:
    build: .
    container_name: backend-AppMachineryPayrollBackend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn machpaymanager.wsgi:application
               --bind 0.0.0.0:8000
               --workers 3
               --access-logfile -
               --error-logfile -
               --capture-output
               --enable-stdio-inheritance"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SERVICE_NAME: machpayroll
      AUDIT_URL: ${AUDIT_URL}
      AUDIT_TOKEN: ${AUDIT_TOKEN}
      AUDIT_HTTP_TIMEOUT: "1.5"
      X_CSCAPI_KEY: ${X_CSCAPI_KEY}

  cron:
    build: .
    container_name: django_cron
    command: bash -c "python manage.py crontab remove || true; python manage.py crontab add; cron -f"
    env_file:
      - .env
    environment:
      SERVICE_NAME: machpayroll
      AUDIT_URL: ${AUDIT_URL}
      AUDIT_TOKEN: ${AUDIT_TOKEN}
      AUDIT_HTTP_TIMEOUT: "1.5"
      X_CSCAPI_KEY: ${X_CSCAPI_KEY}
    depends_on:
      - web

volumes:
  machpay_postgres_data:
  
